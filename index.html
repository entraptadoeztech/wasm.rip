  <body>
    <div id="lowkey"></div>
    <nav>
      <div class="container">
        <span>space-outlawz.rip</span>

          <a href="#members">members</a>
          <a href="#featured">ports</a>
          <a href="#about">about</a>
          <a href = "#credit">Credits & Extra</a>
        </div>
      </div>

    <main>
      <div class="container">
        <h1>space-outlawz</h1>
       <section class="group-section" id="members">
  <h2>members</h2>
  <div class="group-grid">
<a class="group-memb" href="https://github.com/entraptadoeztech" target="_blank">
      <img src="img/IMG_1048.jpeg" />
      <span>entraptadoeztech</span>
    </a>
  </div>
</section>
        <section class="group-section" id="featured">
          <div class="section-header">
            <h2>featured ports</h2>
            <button class="show-all-btn" id="toggle-all-ports">show all ports</button>
          </div>
          <div class="game-grid featured-grid"></div>
        </section>

        <section class="group-section" id="about">
          <h2>about us</h2>
          <p class="about-text">
            a group of nerds and geeks bringing the fun in school!
          </p>
        </section>
      </div>
    </main>



    <script>
      const featuredHolder = document.querySelector(".featured-grid");
      const toggleBtn = document.querySelector("#toggle-all-ports");

      fetch("games.json")
        .then((res) => res.json())
        .then((games) => {
          const byName = (a, b) =>
            a.name.localeCompare(b.name, undefined, { sensitivity: "base" });

          const featured = games.filter((g) => g.featured).sort(byName);
          const rest = games.filter((g) => !g.featured).sort(byName);
          const sorted = [...featured, ...rest];

          let showingAll = false;

          // the urge to just use innerhtml instead of ts

          const renderInto = (holder, list) => {
            holder.innerHTML = "";
            list.forEach((game) => {
              const gameThing = document.createElement("div");
              gameThing.classList.add("game-card");

              const gameImage = document.createElement("img");
              gameImage.src = game.imageUrl;

              const gameInfo = document.createElement("div");
              gameInfo.classList.add("game-info");

              const gameTitle = document.createElement("span");
              gameTitle.classList.add("game-title");
              gameTitle.textContent = game.name;

              const gamePorter = document.createElement("span");
              gamePorter.classList.add("game-desc"); // not rlly a desc but wtv(sexyplankton) -- maybe add one later? todolist prob ( shayder )
              gamePorter.textContent = `port by ${game.porter}`;

              gameInfo.appendChild(gameTitle);
              gameInfo.appendChild(gamePorter);
              gameThing.appendChild(gameImage);
              gameThing.appendChild(gameInfo);

              gameThing.addEventListener("click", () => {
                window.open(game.gameUrl, "_blank");
              });

              holder.appendChild(gameThing);
            });
          };

          renderInto(featuredHolder, featured);

          toggleBtn.addEventListener("click", () => {
            showingAll = !showingAll;
            renderInto(featuredHolder, showingAll ? sorted : featured);
            toggleBtn.textContent = showingAll ? "show featured" : "show all ports";
            document.querySelector("#featured h2").textContent = showingAll ? "all ports" : "featured ports";
          });
        })
        .catch(() => {
          alert("hi, games failed to load, either someone fucked something up or idk");
        });
    
    </script>
